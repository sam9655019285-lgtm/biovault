[project]
name = "biovault"
version = "1.0.0"
description = "BioVault - DNA digital data storage and error simulation platform (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.5.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
